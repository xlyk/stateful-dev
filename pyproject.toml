[project]
name = "stateful-dev"
version = "0.1.0"
description = "Stateful development worker utilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
stateful-dev = "stateful_dev.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
per-file-ignores = { "tests/*" = ["E501"] }

[tool.pytest.ini_options]
markers = [
    "local_wrapper: tests that run the real ~/.hermes/scripts wrapper",
]
